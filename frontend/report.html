<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendify | Reports</title>
<link rel="stylesheet" href="styles/navbar.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="scripts/navbar.js" defer></script>
<style>

:root {
    --bg-primary: linear-gradient(135deg, #4f46e5, #6366f1);
    --bg-secondary: #f8fafc;
    --card-bg: white;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --success: #10b981;
    --danger: #ef4444;
    --purple: #8b5cf6;
    --shadow: 0 10px 40px rgba(0,0,0,0.08);
}

[data-theme="dark"] {
    --bg-secondary: #0f172a;
    --card-bg: #1e293b;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
}

* { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

body { 
    background: var(--bg-secondary) url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="%234f46e50a"/><circle cx="75" cy="75" r="1.5" fill="%236366f10a"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>'); 
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.reports {
  max-width: 1400px;
  width: 100%;
  margin: 1.5rem auto;
  padding: 0 1.5rem;
  flex: 1;
}

header h1 {
  font-size: clamp(1.8rem, 3.5vw, 2.5rem);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.subtitle {
  color: var(--text-secondary);
  font-size: clamp(0.9rem, 1.5vw, 1.1rem);
  margin-top: 0.25rem;
}

/* FILTERS */
.filters {
  margin: 1.5rem 0;
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  align-items: center;
  background: var(--card-bg);
  padding: 1.25rem 1.5rem;
  border-radius: 20px;
  box-shadow: var(--shadow);
}

.filters input, .filters select {
  padding: 0.75rem 1rem;
  border-radius: 10px;
  border: 1px solid #e2e8f0;
  font-size: 0.95rem;
  min-height: 44px;
  background: var(--card-bg);
  color: var(--text-primary);
  outline: none;
  flex: 1;
  min-width: 160px;
}

.filters input:focus, .filters select:focus {
  border-color: #4f46e5;
}

.filters button {
  background: var(--bg-primary);
  color: white;
  border: none;
  padding: 0.75rem 1.5rem;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.95rem;
  font-weight: 600;
  min-height: 44px;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  white-space: nowrap;
}

.filters button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(79, 70, 229, 0.3);
}

/* SUMMARY CARDS */
.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.25rem;
  margin-bottom: 1.5rem;
}

.card {
  background: var(--card-bg);
  padding: 1.25rem 1.5rem;
  border-radius: 20px;
  box-shadow: var(--shadow);
  text-align: center;
  border: 1px solid rgba(0,0,0,0.04);
}

.card h3 {
  color: var(--text-secondary);
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 0.4rem;
}

.card p {
  font-size: clamp(1.8rem, 3.5vw, 2.4rem);
  font-weight: bold;
  color: var(--text-primary);
}

/* TABLE */
.table-container {
  margin-top: 1.5rem;
  background: var(--card-bg);
  border-radius: 20px;
  box-shadow: var(--shadow);
  overflow: hidden;
  border: 1px solid rgba(0,0,0,0.04);
}

.table-scroll {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  display: block;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 520px;
}

th, td {
  padding: 0.9rem 1.25rem;
  text-align: left;
  font-size: 0.95rem;
  white-space: nowrap;
}

th {
  background: #4f46e5;
  color: white;
  font-weight: 600;
  white-space: nowrap;
}

tr:nth-child(even) {
  background: rgba(0,0,0,0.02);
}

.present {
  color: var(--success);
  font-weight: bold;
}

.absent {
  color: var(--danger);
  font-weight: bold;
}

/* RESPONSIVE BREAKPOINTS */
@media (max-width: 768px) {
  .reports {
    padding: 0 1rem;
    margin: 1rem auto;
  }

  .filters {
    flex-direction: column;
    align-items: stretch;
    padding: 1rem;
    gap: 0.75rem;
  }

  .filters input, .filters select, .filters button {
    width: 100%;
  }

  th, td {
    padding: 0.75rem 0.85rem;
    font-size: 0.88rem;
  }
}

@media (max-width: 480px) {
  .summary {
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
  }

  .card {
    padding: 1rem 0.75rem;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="nav-left">
        <button class="hamburger"><i class="fas fa-bars"></i></button>
        <div class="logo">📋 Attendify</div>
    </div>
    <ul class="nav-links">
        <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="attendance.html"><i class="fas fa-camera"></i> Attendance</a></li>
        <li><a href="students.html"><i class="fas fa-users"></i> Students</a></li>
        <li><a href="register-face.html"><i class="fas fa-user-plus"></i> Register Face</a></li>
        <li><a href="report.html"><i class="fas fa-chart-bar"></i> Reports</a></li>
        <li class="login"><a href="login.html"><i class="fas fa-user"></i> Login</a></li>
        <li class="logout"><a href="logout.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul>
</nav>

<section class="reports">

<header>
  <h1><i class="fas fa-chart-line"></i> Reports Dashboard</h1>
  <p class="subtitle">Track attendance analytics</p>
</header>

<!-- FILTERS -->
<div class="filters">
  <input type="date" id="dateFilter">
  
  <select id="classFilter">
    <option value="all">All Classes</option>
    <option value="CSE">CSE</option>
    <option value="IT">IT</option>
    <option value="AI">AI</option>
    <option value="MBA">MBA</option>
    <option value="M.A">M.A</option>
    <option value="other">Other</option>
  </select>

  <button onclick="filterData()">Apply Filter</button>
</div>

<!-- SUMMARY -->
<div class="summary">
  <div class="card">
    <h3>Total Students</h3>
    <p id="totalStudents">0</p>
  </div>
  <div class="card">
    <h3>Present</h3>
    <p id="presentCount">0</p>
  </div>
  <div class="card">
    <h3>Absent</h3>
    <p id="absentCount">0</p>
  </div>
  <div class="card">
    <h3>Attendance %</h3>
    <p id="attendancePercent">0%</p>
  </div>
</div>

<!-- TABLE -->
<div class="table-container">
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Class</th>
          <th>Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="reportTable"></tbody>
    </table>
  </div>
</div>

</section>

<script src="scripts/report.js"></script>

</body>
</html>
